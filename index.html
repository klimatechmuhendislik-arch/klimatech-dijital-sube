        let rates = { "$": 34.15, "€": 36.80, "TL": 1.0 };
        let cart = []; let discount = 0; let userMode = "Standart";

        function updateMode(d, m) {
            discount = d; userMode = m;
            document.getElementById('btn-std').style.borderColor = d === 0 ? '#001f3f' : 'transparent';
            document.getElementById('btn-usta').style.borderColor = d === 4 ? '#16a34a' : 'transparent';
            render(); updateCart();
        }

        function addToCart(pid) {
            const p = products.find(x => x.id == pid);
            const inCart = cart.find(x => x.id == pid);
            if (inCart) inCart.q++; else cart.push({...p, q: 1});
            updateCart();
        }

        function updateCart() {
            const count = cart.reduce((a, b) => a + b.q, 0);
            document.getElementById('cart-count').innerText = count;
            let total = 0;
            cart.forEach(x => { total += (x.p * rates[x.cur]) * (1 - (discount/100)) * x.q; });
            document.getElementById('total-price').innerText = total.toLocaleString('tr-TR', {maximumFractionDigits: 2}) + " TL";
            document.getElementById('order-bar').style.display = count > 0 ? 'flex' : 'none';
        }

        function render() {
            const catalog = document.getElementById('catalog');
            const term = document.getElementById('search').value.toLowerCase();
            catalog.innerHTML = '';
            products.filter(p => p.name.toLowerCase().includes(term) || p.id.includes(term)).forEach(p => {
                const finalP = (p.p * rates[p.cur]) * (1 - (discount/100));
                catalog.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl shadow border flex flex-col justify-between">
                        <div>
                            <span class="text-[9px] font-black text-blue-900 bg-blue-50 px-2 py-1 rounded uppercase">${p.cat}</span>
                            <h2 class="font-bold text-gray-800 my-2 text-sm h-10 overflow-hidden uppercase">${p.name}</h2>
                            <p class="text-[10px] text-gray-400">${p.id}</p>
                        </div>
                        <div class="mt-4 flex items-center justify-between">
                            <span class="text-lg font-black text-[#001f3f]">${finalP.toLocaleString('tr-TR', {maximumFractionDigits: 2})} TL</span>
                            <button onclick="addToCart('${p.id}')" class="bg-[#001f3f] text-white w-10 h-10 rounded-lg flex items-center justify-center">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>`;
            });
        }

        function showQuotation() {
            const modal = document.getElementById('quotation-modal');
            const content = document.getElementById('quotation-content');
            let itemsHtml = '';
            cart.forEach(x => {
                const itemPrice = (x.p * rates[x.cur]) * (1 - (discount/100));
                itemsHtml += `<div class="flex justify-between border-b py-3 text-xs">
                    <div><b>${x.name}</b><br><small>${x.id}</small></div>
                    <div class="text-right"><b>${x.q} ADET</b><br>${(itemPrice * x.q).toLocaleString('tr-TR')} TL</div>
                </div>`;
            });
            content.innerHTML = `<h3 class="text-center font-black mb-6 border-b pb-4">KLİMETECH & vrfdepon TEKLİF FORMU</h3>${itemsHtml}<div class="mt-6 text-right font-black text-xl">TOPLAM: ${document.getElementById('total-price').innerText}</div>`;
            modal.classList.remove('hidden');
        }

        function closeQuotation() { document.getElementById('quotation-modal').classList.add('hidden'); }

        // WHATSAPP FONKSİYONU
        function sendOrder() {
            let msg = `🛠 *KLİMATECH TEKLİF ONALAN ÜRÜNLER*\n\n`;
            cart.forEach(x => { msg += `✅ *${x.name}* (${x.q} Adet)\n`; });
            msg += `\n💰 *TOPLAM: ${document.getElementById('total-price').innerText}*`;
            window.open(`https://wa.me/905326809080?text=${encodeURIComponent(msg)}`);
        }

        // İSTEDİĞİN MAİL FONKSİYONU BURADA
        function sendEmail() {
            if(cart.length === 0) return alert("Önce ürün ekle usta!");
            let subject = encodeURIComponent("Teklif: Klimatech & vrfdepon Güncel Ürün Listesi");
            let bodyText = "Sayın İlgili,\n\nTalep etmiş olduğunuz ürünlere ait fiyat teklifimiz aşağıdadır:\n\n";
            bodyText += "--------------------------------------------------\n";
            cart.forEach(x => {
                const itemPrice = (x.p * rates[x.cur]) * (1 - (discount/100));
                bodyText += `📦 ${x.name}\n`;
                bodyText += `   Kod: ${x.id} | Adet: ${x.q}\n`;
                bodyText += `   Birim: ${itemPrice.toLocaleString('tr-TR')} TL | Toplam: ${(itemPrice * x.q).toLocaleString('tr-TR')} TL\n`;
                bodyText += "--------------------------------------------------\n";
            });
            bodyText += `\n💰 GENEL TOPLAM: ${document.getElementById('total-price').innerText}\n`;
            bodyText += "\nNot: Fiyatlarımıza KDV dahil değildir.\n\nSaygılarımla,\nMustafa Fatih Başpehlivan\n0532 680 90 80\nvrfdepon.com";
            window.location.href = `mailto:?subject=${subject}&body=${encodeURIComponent(bodyText)}`;
        }
