<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klimatech & vrfdepon | B2B Katalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-900 pb-32">

    <header class="bg-[#001f3f] text-white shadow-lg sticky top-0 z-50 border-b-4 border-yellow-500">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-white p-2 rounded-lg text-[#001f3f] font-black text-xl italic leading-none">KLM</div>
                <div>
                    <h1 class="text-lg font-bold leading-none uppercase tracking-tight">Klimatech Mühendislik</h1>
                    <p class="text-[10px] text-yellow-400 font-bold tracking-widest uppercase">Bursa - @vrfdepon</p>
                </div>
            </div>
            <div class="bg-yellow-500 text-[#001f3f] px-4 py-2 rounded-xl font-black text-sm flex items-center gap-2">
                <i class="fa-solid fa-shopping-cart"></i> <span id="cart-count">0</span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div class="bg-white p-3 rounded-2xl shadow-sm flex gap-2 border border-gray-200">
                <button onclick="updateMode(0, 'Standart')" id="btn-std" class="flex-1 py-3 rounded-xl font-bold text-xs border-2 border-blue-900 bg-blue-50 text-blue-900">STANDART</button>
                <button onclick="updateMode(4, 'Mustafa Usta')" id="btn-usta" class="flex-1 py-3 rounded-xl font-bold text-xs border-2 border-transparent text-gray-400 italic uppercase">MUSTAFA USTA (-%4)</button>
            </div>
            <div class="bg-white p-3 rounded-2xl shadow-sm flex items-center justify-center gap-6 border-l-8 border-blue-900">
                <div class="text-center"><span class="block text-[9px] font-black text-gray-400 uppercase italic">USD/TRY</span><span class="text-xl font-black text-blue-900 italic">₺33,65</span></div>
                <div class="text-center"><span class="block text-[9px] font-black text-gray-400 uppercase italic">EUR/TRY</span><span class="text-xl font-black text-blue-900 italic">₺36,50</span></div>
            </div>
        </div>

        <div class="mb-8 relative">
            <input type="text" id="search" onkeyup="render()" placeholder="Ürün, Marka veya Ölçü Ara..." class="w-full p-5 rounded-2xl border-none shadow-xl bg-white font-bold text-gray-700">
            <i class="fa-solid fa-search absolute right-6 top-5.5 text-gray-300"></i>
        </div>

        <div id="catalog" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <div id="order-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t p-6 shadow-[0_-10px_30px_rgba(0,0,0,0.1)] z-50 hidden">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div>
                <p class="text-[10px] font-bold text-gray-400 uppercase italic">Toplam Tutar</p>
                <p id="total-price" class="text-3xl font-black text-blue-900 italic">0.00 TL</p>
            </div>
            <button onclick="sendOrder()" class="bg-green-600 text-white px-8 py-4 rounded-2xl font-black text-sm uppercase flex items-center gap-3">
                <i class="fa-brands fa-whatsapp text-2xl"></i> SİPARİŞ VER
            </button>
        </div>
    </div>

    <script>
        const rates = { "$": 33.65, "€": 36.50, "TL": 1.0 };
        const products = [
    // --- TOTCHEM GAZ GRUBU (TAM LİSTE) ---
    { id: 10, cat: "GAZ", name: "TOTCHEM R410A Soğutucu Gaz (11.3 KG)", p: 138.00, cur: "$", spec: "Orijinal Tüp" },
    { id: 11, cat: "GAZ", name: "TOTCHEM R32 Soğutucu Gaz (9 KG)", p: 138.78, cur: "$", spec: "Orijinal Tüp" },
    { id: 12, cat: "GAZ", name: "TOTCHEM R404A Soğutucu Gaz (10.9 KG)", p: 94.06, cur: "$", spec: "Orijinal Tüp" },
    { id: 13, cat: "GAZ", name: "TOTCHEM R407C Soğutucu Gaz (11.3 KG)", p: 138.00, cur: "$", spec: "Orijinal Tüp" },
    { id: 14, cat: "GAZ", name: "TOTCHEM R134A Soğutucu Gaz (13.6 KG)", p: 113.38, cur: "$", spec: "Orijinal Tüp" },

    // --- WIPCOOL SERİSİ (EKSIKSIZ ANALİZ) ---
    { id: 100, cat: "WIPCOOL", name: "P18 Drenaj Pompası", p: 53.82, cur: "$", spec: "Sessiz Tip" },
    { id: 101, cat: "WIPCOOL", name: "P36 Drenaj Pompası", p: 61.30, cur: "$", spec: "Yüksek Kapasite" },
    { id: 102, cat: "WIPCOOL", name: "P120S Drenaj Pompası", p: 237.11, cur: "$", spec: "Endüstriyel Tip" },
    { id: 103, cat: "WIPCOOL", name: "S1 Vakum Pompası (1 CFM)", p: 67.76, cur: "$", spec: "Hafif Servis" },
    { id: 104, cat: "WIPCOOL", name: "S1.5 Vakum Pompası (1.5 CFM)", p: 95.93, cur: "$", spec: "Orta Segment" },
    { id: 105, cat: "WIPCOOL", name: "S2 Vakum Pompası (2 CFM)", p: 123.93, cur: "$", spec: "Hızlı Vakum" },
    { id: 106, cat: "WIPCOOL", name: "C10B Akülü Temizleme Makinası", p: 174.11, cur: "$", spec: "Kablosuz" },
    { id: 107, cat: "WIPCOOL", name: "C30S Buharlı Temizleme", p: 393.22, cur: "$", spec: "Profesyonel" },
    { id: 108, cat: "WIPCOOL", name: "EF-2 Havşa Takımı", p: 66.48, cur: "$", spec: "Hassas" },
    { id: 109, cat: "WIPCOOL", name: "EF-2LR Cırcırlı Havşa", p: 93.19, cur: "$", spec: "Matkap Uyumlu" },
    { id: 110, cat: "WIPCOOL", name: "MDG1 Tekli Dijital Manifold", p: 126.40, cur: "$", spec: "Bluetooth" },
    { id: 111, cat: "WIPCOOL", name: "HTW-80 Dijital Tork Anahtarı", p: 216.83, cur: "$", spec: "Cırcırlı" },
    { id: 112, cat: "WIPCOOL", name: "HE-11 Boru Şişirme Aparatı", p: 355.75, cur: "$", spec: "Full Set" },
    { id: 113, cat: "WIPCOOL", name: "MRS120 Gaz Terazisi", p: 256.26, cur: "$", spec: "Solenoid Vanalı" },
    { id: 114, cat: "WIPCOOL", name: "MRM55 Gaz Geri Toplama", p: 666.27, cur: "$", spec: "Recovery" },

    // --- PANASONIC & DANFOSS KOMPRESÖRLER ---
    { id: 200, cat: "PANASONIC", name: "C-SCN673H8K R407C Scroll", p: 702.00, cur: "€", spec: "Panasonic" },
    { id: 201, cat: "PANASONIC", name: "C-SCN603
        H8K R407C Scroll", p: 702.00, cur: "€", spec: "Panasonic" },
    { id: 202, cat: "PANASONIC", name: "2K22S225A Rotari (12k BTU)", p: 145.00, cur: "$", spec: "R22" },
    { id: 203, cat: "PANASONIC", name: "2V32S225A Rotari (18k BTU)", p: 195.00, cur: "$", spec: "R22" },
    { id: 204, cat: "DANFOSS", name: "MTZ 032-4VI Kompresör", p: 592.88, cur: "€", spec: "Maneurop" },
    { id: 205, cat: "DANFOSS", name: "MTZ 040-4VI Kompresör", p: 669.77, cur: "€", spec: "Maneurop" },
    { id: 206, cat: "DANFOSS", name: "KP15 Presostat Kombine", p: 64.50, cur: "€", spec: "Otomatik" },
    { id: 207, cat: "DANFOSS", name: "KP5 Presostat", p: 41.50, cur: "€", spec: "Y.B. Manuel" },

    // --- SARKUYSAN BAKIR GRUBU ---
    { id: 300, cat: "SARKUYSAN", name: "1/4\"-0,80mmx50m İzo.Boru", p: 3.32, cur: "$", spec: "Metre" },
    { id: 301, cat: "SARKUYSAN", name: "3/8\"-0,80mmx50m İzo.Boru", p: 4.81, cur: "$", spec: "Metre" },
    { id: 302, cat: "SARKUYSAN", name: "1/2\"-0,90mmx50m İzo.Boru", p: 6.75, cur: "$", spec: "Metre" },
    { id: 303, cat: "KAYNAK", name: "ASA 3110 Bakır Kaynak Teli", p: 35.48, cur: "$", spec: "3mm" }
];

        let cart = [];
        let discount = 0;
        let userMode = "Standart";

        function updateMode(d, m) {
            discount = d; userMode = m;
            document.getElementById('btn-std').className = d === 0 ? "flex-1 py-3 rounded-xl font-bold text-xs bg-blue-50 text-blue-900 border-2 border-blue-900" : "flex-1 py-3 rounded-xl font-bold text-xs bg-white text-gray-400";
            document.getElementById('btn-usta').className = d === 4 ? "flex-1 py-3 rounded-xl font-bold text-xs bg-green-50 text-green-700 border-2 border-green-700 italic" : "flex-1 py-3 rounded-xl font-bold text-xs bg-white text-gray-400";
            render(); updateCart();
        }

        function addToCart(pid) {
            const p = products.find(x => x.id === pid);
            const inCart = cart.find(x => x.id === pid);
            if (inCart) inCart.q++; else cart.push({...p, q: 1});
            updateCart();
        }

        function updateCart() {
            const count = cart.reduce((a, b) => a + b.q, 0);
            document.getElementById('cart-count').innerText = count;
            let total = 0;
            cart.forEach(x => { total += (x.p * rates[x.cur]) * (1 - (discount/100)) * x.q; });
            document.getElementById('total-price').innerText = total.toLocaleString('tr-TR', {minimumFractionDigits: 2}) + " TL";
            document.getElementById('order-bar').style.display = count > 0 ? 'block' : 'none';
        }

        function render() {
            const catalog = document.getElementById('catalog');
            const term = document.getElementById('search').value.toLowerCase();
            catalog.innerHTML = '';
            products.filter(p => p.name.toLowerCase().includes(term) || p.cat.toLowerCase().includes(term)).forEach(p => {
                const finalPrice = (p.p * rates[p.cur]) * (1 - (discount/100));
                catalog.innerHTML += `<div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex flex-col"><div class="flex justify-between items-start mb-4"><span class="bg-blue-50 text-blue-800 text-[9px] font-black px-3 py-1 rounded-full uppercase">${p.cat}</span><span class="text-gray-300 text-[10px] font-bold">${p.cur}${p.p}</span></div><h3 class="font-black text-gray-800 mb-1 leading-tight h-10 overflow-hidden">${p.name}</h3><p class="text-[11px] text-gray-400 font-bold mb-6">${p.spec}</p><div class="mt-auto flex items-center justify-between pt-4 border-t border-gray-50"><span class="text-xl font-black text-blue-900 italic">${finalPrice.toLocaleString('tr-TR', {maximumFractionDigits: 2})} TL</span><button onclick="addToCart(${p.id})" class="bg-[#001f3f] text-white w-12 h-12 rounded-2xl flex items-center justify-center"><i class="fa-solid fa-plus text-lg"></i></button></div></div>`;
            });
        }
        render();

        function sendOrder() {
            let msg = `🛠 *Klimatech Sipariş (${userMode})*\n\n`;
            cart.forEach(x => { msg += `• *${x.name}* (${x.q} Adet)\n`; });
            msg += `\n💰 *TOPLAM: ${document.getElementById('total-price').innerText}*`;
            window.open(`https://wa.me/905326809080?text=${encodeURIComponent(msg)}`);
        }
    </script>
</body>
</html>
