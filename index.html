        let rates = { "$": 34.15, "€": 36.80, "TL": 1.0 };
        let cart = []; let discount = 0; let userMode = "Standart";

        async function fetchRates() {
            try {
                const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
                const data = await res.json();
                rates["$"] = data.rates.TRY;
                rates["€"] = data.rates.TRY / data.rates.EUR;
                document.getElementById('usd-rate').innerText = "₺" + rates["$"].toFixed(2);
                document.getElementById('eur-rate').innerText = "₺" + rates["€"].toFixed(2);
                render();
            } catch (e) { 
                document.getElementById('usd-rate').innerText = "₺34.15";
                document.getElementById('eur-rate').innerText = "₺36.80";
                render(); 
            }
        }

        function updateMode(d, m) {
            discount = d; userMode = m;
            document.getElementById('btn-std').className = d === 0 ? "flex-1 py-5 rounded-2xl font-black text-xs border-2 border-blue-900 bg-blue-50 text-blue-900 shadow-inner" : "flex-1 py-5 rounded-2xl font-black text-xs border-2 border-transparent text-gray-400 italic uppercase";
            document.getElementById('btn-usta').className = d === 4 ? "flex-1 py-5 rounded-2xl font-black text-xs border-2 border-green-600 bg-green-50 text-green-700 italic shadow-inner" : "flex-1 py-5 rounded-2xl font-black text-xs border-2 border-transparent text-gray-400 italic uppercase";
            render(); updateCart();
        }

        function addToCart(pid) {
            const p = products.find(x => x.id == pid);
            const inCart = cart.find(x => x.id == pid);
            if (inCart) inCart.q++; else cart.push({...p, q: 1});
            updateCart();
        }

        function updateCart() {
            const count = cart.reduce((a, b) => a + b.q, 0);
            document.getElementById('cart-count').innerText = count;
            let total = 0;
            cart.forEach(x => { total += (x.p * rates[x.cur]) * (1 - (discount/100)) * x.q; });
            document.getElementById('total-price').innerText = total.toLocaleString('tr-TR', {maximumFractionDigits: 2}) + " TL";
            document.getElementById('order-bar').style.display = count > 0 ? 'flex' : 'none';
        }

        function render() {
            const catalog = document.getElementById('catalog');
            const term = document.getElementById('search').value.toLowerCase();
            catalog.innerHTML = '';
            products.filter(p => p.name.toLowerCase().includes(term) || p.cat.toLowerCase().includes(term) || p.id.includes(term)).forEach(p => {
                const finalP = (p.p * rates[p.cur]) * (1 - (discount/100));
                catalog.innerHTML += `
                    <div class="bg-white p-7 rounded-[2rem] shadow-lg hover:shadow-2xl transition-all border border-gray-100 flex flex-col group relative">
                        <span class="absolute top-4 right-4 text-[9px] font-bold text-gray-300 italic">${p.id}</span>
                        <div class="mb-4"><span class="bg-[#001f3f] text-white text-[9px] font-black px-4 py-1.5 rounded-full uppercase italic tracking-widest">${p.cat}</span></div>
                        <h2 class="font-black text-gray-800 mb-2 leading-tight h-14 overflow-hidden text-base uppercase">${p.name}</h2>
                        <p class="text-[10px] text-blue-400 font-bold mb-6 italic uppercase tracking-widest">${p.spec}</p>
