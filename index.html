            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                <button onclick="updatePrice(4, 'Mustafa Usta')" class="bg-green-100 p-5 rounded-2xl border-2 border-green-200 hover:border-green-600 font-black text-green-800 transition-all text-center italic text-xl shadow-lg animate-pulse">MUSTAFA USTA (-%4)</button>
            </div>

        ];

        let discountRate = 0;
        let activeUser = "Son Müşteri";
        const exchangeRate = 33.65; // Güncel Kur

        function updatePrice(rate, user) {
            discountRate = rate;
            activeUser = user;
            document.getElementById('user-display').innerText = `Mod: ${user} (-%${rate})`;
            render();
        }

        function order(name, price) {
            const phone = "905326809080";
            const msg = `Selamun Aleyküm Mustafa Fatih Bey,\n\nŞu ürünü sipariş vermek istiyorum:\n📦 *${name}*\n💰 Fiyat: *${price} TL*\n👤 Müşteri: *${activeUser}*\n\nHayırlı işler.`;
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`);
        }

        function render() {
            const catalog = document.getElementById('catalog');
            catalog.innerHTML = '';
            products.forEach(p => {
                const finalPrice = (p.usd * exchangeRate) * (1 - (discountRate / 100));
                catalog.innerHTML += `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-col justify-between hover:scale-[1.02] transition-all">
                        <div>
                            <span class="text-[9px] font-black bg-blue-100 text-blue-900 px-2 py-1 rounded uppercase tracking-widest">${p.cat}</span>
                            <h3 class="mt-2 text-sm font-bold text-slate-800 leading-tight">${p.name}</h3>
                        </div>
                        <div class="mt-4 pt-4 border-t border-slate-100 text-center">
                            <span class="text-2xl font-black text-slate-900">${finalPrice.toLocaleString('tr-TR', {maximumFractionDigits:2})} TL</span>
                            <p class="text-[10px] text-slate-400 mt-1 italic">Liste: $${p.usd}</p>
                            <button onclick="order('${p.name}', '${finalPrice.toFixed(2)}')" class="mt-4 w-full bg-[#001f3f] text-yellow-500 font-black py-3 rounded-xl text-xs shadow-lg uppercase tracking-widest">Sipariş Ver</button>
                        </div>
                    </div>
                `;
            });
        }
        render();
    </script>
</body>
</html>
