<script>
    function openAdmin() {
        const pass = prompt("Yetkili Girişi:");
        if(pass === "1234") {
            document.getElementById('adminPanel').classList.remove('hidden');
            renderAdmin();
        }
    }

    function closeAdmin() {
        document.getElementById('adminPanel').classList.add('hidden');
        // Eğer ana sayfada ürün listesi varsa burayı tetikle: renderUrunler();
    }

    function renderAdmin() {
        const body = document.getElementById('stok-body');
        body.innerHTML = "";
        
        for (let code in hvac_db) {
            const item = hvac_db[code];
            const isLow = item.stok <= item.kritik;
            
            body.innerHTML += `
                <div class="admin-card ${isLow ? 'border-red-200 bg-red-50' : ''}">
                    <div>
                        <span class="block text-[10px] text-gray-400 font-mono">${code}</span>
                        <strong class="text-sm text-dark uppercase">${item.ad}</strong>
                    </div>
                    <div class="text-center">
                        <input type="number" value="${item.fiyat}" onchange="updateVal('${code}', 'fiyat', this.value)" class="w-20 p-1 border rounded text-center font-bold text-primary">
                    </div>
                    <div class="text-center">
                        <input type="number" value="${item.stok}" onchange="updateVal('${code}', 'stok', this.value)" class="w-16 p-1 border rounded text-center font-bold ${isLow ? 'text-red-600' : 'text-green-600'}">
                    </div>
                    <div class="text-center">
                        <input type="number" value="${item.kritik}" onchange="updateVal('${code}', 'kritik', this.value)" class="w-16 p-1 border rounded text-center text-xs text-gray-500">
                    </div>
                    <button onclick="deleteProd('${code}')" class="text-red-400 hover:text-red-700"><i class="fas fa-trash"></i></button>
                </div>
            `;
        }
    }

    function updateVal(code, field, val) {
        hvac_db[code][field] = parseFloat(val);
        saveDB();
        renderAdmin(); // Görünümü tazele
    }

    function addProduct() {
        const kod = document.getElementById('in-kod').value;
        const ad = document.getElementById('in-ad').value;
        const fiyat = parseFloat(document.getElementById('in-fiyat').value);
        const stok = parseFloat(document.getElementById('in-stok').value);
        const kritik = parseFloat(document.getElementById('in-kritik').value);

        if(!kod || !ad) return alert("Kod ve Ad boş olamaz!");

        hvac_db[kod] = { ad, fiyat, stok, kritik };
        saveDB();
        renderAdmin();
        // Inputları temizle
        document.querySelectorAll('#adminPanel input[type="text"], #adminPanel input[type="number"]').forEach(i => i.value = "");
    }

    function deleteProd(code) {
        if(confirm("Bu ürünü sistemden silmek istediğine emin misin usta?")) {
            delete hvac_db[code];
            saveDB();
            renderAdmin();
        }
    }
</script>
